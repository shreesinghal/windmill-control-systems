<html>
  <head>
    <title>Title</title>
  </head>
  <body>
    <div id="">
      <button onclick="onConnect()">Connect</button>
      <button onclick="onEStop()">E-Stop</button>
      <input
        type="range"
        onclick="
        pitch = Number(this.value)"
      />
    </div>
    <script>
      var eStop = false;
      var pitch = 0;

      async function onConnect() {
        let device = await navigator.serial.requestPort({ filters: [] });
        await device.open({ baudRate: 9600 });

        let reader = await device.readable.getReader();
        let writer = await device.writable.getWriter();
        setInterval(async () => {
          writer.write(new Uint8Array([eStop ? 100 : 0]));
          let data = await reader.read();
          // console.log(data.value[0]);
          console.log(pitch);
        }, 50);
      }

      function onEStop() {
        eStop = !eStop;
      }
    </script>
    <style>
      body {
      }
    </style>
  </body>
</html>
